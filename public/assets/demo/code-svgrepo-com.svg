<svg width="320" height="400" viewBox="0 0 320 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. Code Icon </ > -->
    <g id="codeIcon">
      <path d="M16.4425 7.32787C16.7196 7.01999 17.1938 6.99503 17.5017 7.27213L19.2392 8.83587C19.9756 9.49853 20.5864 10.0482 21.0058 10.5468C21.4468 11.071 21.7603 11.6343 21.7603 12.3296C21.7603 13.0249 21.4468 13.5882 21.0058 14.1124C20.5864 14.611 19.9756 15.1607 19.2392 15.8233L17.5017 17.3871C17.1938 17.6642 16.7196 17.6392 16.4425 17.3313C16.1654 17.0234 16.1904 16.5492 16.4983 16.2721L18.1947 14.7453C18.9826 14.0362 19.5138 13.5558 19.8579 13.1468C20.1882 12.7542 20.2603 12.525 20.2603 12.3296C20.2603 12.1342 20.1882 11.905 19.8579 11.5124C19.5138 11.1034 18.9826 10.623 18.1947 9.91389L16.4983 8.38707C16.1904 8.10997 16.1654 7.63576 16.4425 7.32787Z" fill="#ffffff"/>
      <path d="M7.50178 8.38707C7.80966 8.10997 7.83462 7.63576 7.55752 7.32787C7.28043 7.01999 6.80621 6.99503 6.49833 7.27213L4.76084 8.83587C4.0245 9.49853 3.41369 10.0482 2.99428 10.5468C2.55325 11.071 2.23975 11.6343 2.23975 12.3296C2.23975 13.0249 2.55325 13.5882 2.99428 14.1124C3.41369 14.611 4.02449 15.1607 4.76082 15.8233L6.49833 17.3871C6.80621 17.6642 7.28043 17.6392 7.55752 17.3313C7.83462 17.0234 7.80966 16.5492 7.50178 16.2721L5.80531 14.7453C5.01743 14.0362 4.48623 13.5558 4.14213 13.1468C3.81188 12.7542 3.73975 12.525 3.73975 12.3296C3.73975 12.1342 3.81188 11.905 4.14213 11.5124C4.48623 11.1034 5.01743 10.623 5.80531 9.91389L7.50178 8.38707Z" fill="#ffffff"/>
      <path d="M14.1816 4.2755C14.5817 4.3827 14.8191 4.79396 14.7119 5.19406L10.7383 20.0238C10.6311 20.4239 10.2198 20.6613 9.81974 20.5541C9.41964 20.4469 9.18221 20.0356 9.28941 19.6355L13.263 4.80583C13.3702 4.40573 13.7815 4.16829 14.1816 4.2755Z" fill="#ffffff"/>
    </g>

    <!-- 2. Terminal CLI Icon >_ -->
    <g id="terminalIcon">
      <path d="M4 6L11 12L4 18" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M13 18H21" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
    </g>

    <!-- 3. Curly Braces Icon { } -->
    <g id="bracesIcon">
      <path d="M9 4C6.5 4 6 5.5 6 8C6 10.5 5 11.5 3 12C5 12.5 6 13.5 6 16C6 18.5 6.5 20 9 20" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <path d="M15 4C17.5 4 18 5.5 18 8C18 10.5 19 11.5 21 12C19 12.5 18 13.5 18 16C18 18.5 17.5 20 15 20" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    </g>

    <!-- 4. Git Branch Icon -->
    <g id="gitBranchIcon">
      <circle cx="7" cy="6" r="2.8" stroke="#ffffff" stroke-width="2" fill="none"/>
      <circle cx="7" cy="18" r="2.8" stroke="#ffffff" stroke-width="2" fill="none"/>
      <circle cx="17" cy="9" r="2.8" stroke="#ffffff" stroke-width="2" fill="none"/>
      <path d="M7 8.8V15.2" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <path d="M7 13.5C7 11 11.5 9 14.2 9" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>

    <!-- 5. Slash Comment Icon // -->
    <g id="slashIcon">
      <path d="M9 4L4 20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M16 4L11 20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- 6. Arrow Function Icon => -->
    <g id="arrowFnIcon">
      <path d="M3 9H13M3 14H13" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M11 6L17 11.5L11 17" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 7. Square Brackets Icon [ ] -->
    <g id="bracketIcon">
      <path d="M8 4H4V20H8" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M16 4H20V20H16" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- 8. Hash / Octothorpe Icon # -->
    <g id="hashIcon">
      <path d="M7 3L5 21M17 3L15 21" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M3 8H20M2 16H19" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- 9. Semicolon Icon ; -->
    <g id="semicolonIcon">
      <circle cx="7" cy="6" r="2.2" fill="#ffffff"/>
      <path d="M7 12C8.5 12 9.2 13 9.2 14.5C9.2 17 6 19.5 5 20" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>

    <!-- 10. Not Equal Operator Icon != -->
    <g id="notEqualIcon">
      <path d="M5 6V11" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="5" cy="16" r="1.4" fill="#ffffff"/>
      <path d="M11 9H19M11 14H19" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- === CODE ICONS </ > === -->
  <!-- 1. Code Icon 1 (Besar & Dominan) di kanan tengah -->
  <use href="#codeIcon" transform="translate(180, 150) scale(3.5) rotate(-6)" opacity="0.95"/>

  <!-- 2. Code Icon 2 (Sedang) di kiri bawah -->
  <use href="#codeIcon" transform="translate(38, 260) scale(2.7) rotate(8)" opacity="0.9"/>

  <!-- 3. Code Icon 3 (Aksen) di kiri atas -->
  <use href="#codeIcon" transform="translate(24, 45) scale(2.2) rotate(-10)" opacity="0.85"/>

  <!-- === ICON UTAMA LAINNYA DI AREA KOSONG === -->
  <!-- 4. Terminal >_ (Besar) di kanan atas -->
  <use href="#terminalIcon" transform="translate(205, 42) scale(2.8) rotate(7)" opacity="0.92"/>

  <!-- 5. Curly Braces { } (Sedang-Besar) di kanan bawah -->
  <use href="#bracesIcon" transform="translate(185, 268) scale(2.5) rotate(-8)" opacity="0.9"/>

  <!-- 6. Git Branch (Sedang) di kiri tengah -->
  <use href="#gitBranchIcon" transform="translate(36, 155) scale(2.3) rotate(5)" opacity="0.88"/>

  <!-- === PENGGANTI BINTANG: SIMBOL SINTAKS KODE DENGAN BERBAGAI UKURAN === -->
  <!-- 7. Slash Comment // di atas-tengah -->
  <use href="#slashIcon" transform="translate(130, 40) scale(1.6) rotate(-5)" opacity="0.85"/>

  <!-- 8. Arrow Function => di tengah-tengah kartu -->
  <use href="#arrowFnIcon" transform="translate(122, 185) scale(1.7) rotate(3)" opacity="0.85"/>

  <!-- 9. Semicolon ; di pojok kanan atas -->
  <use href="#semicolonIcon" transform="translate(285, 22) scale(1.8) rotate(5)" opacity="0.8"/>

  <!-- 10. Square Brackets [ ] di bawah-tengah -->
  <use href="#bracketIcon" transform="translate(132, 315) scale(1.6) rotate(-4)" opacity="0.85"/>

  <!-- 11. Hash # di tepi kiri tengah -->
  <use href="#hashIcon" transform="translate(12, 215) scale(1.4) rotate(-8)" opacity="0.8"/>

  <!-- 12. Not Equal != di tepi kanan tengah -->
  <use href="#notEqualIcon" transform="translate(282, 135) scale(1.5) rotate(6)" opacity="0.82"/>
</svg>