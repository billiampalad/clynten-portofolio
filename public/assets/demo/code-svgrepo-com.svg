  <!-- Sparkle tengah-tengah kartu -->
  <use href="#sparkleIcon" transform="translate(126, 185) scale(0.7) rotate(15)" opacity="0.8"/>

  <!-- Sparkle pojok kanan paling atas -->
  <use href="#sparkleIcon" transform="translate(286, 22) scale(0.75)" opacity="0.75"/>

  <!-- Sparkle bawah-tengah (antara kiri & kanan) -->
  <use href="#sparkleIcon" transform="translate(136, 315) scale(0.85) rotate(-10)" opacity="0.85"/>

  <!-- Sparkle tepi kiri tengah -->
  <use href="#sparkleIcon" transform="translate(12, 218) scale(0.55)" opacity="0.7"/>

  <!-- Sparkle tepi kanan tengah -->
  <use href="#sparkleIcon" transform="translate(288, 135) scale(0.65)" opacity="0.75"/>
