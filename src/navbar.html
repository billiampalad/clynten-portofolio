<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Navbar Component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      color: #111827;
      min-height: 250vh; /* Ruang scroll panjang tanpa perlu elemen konten di bawah */
    }

    /* Navbar Container */
    .navbar {
      width: 100%;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      background: #ffffff;
      border-bottom: 1px solid #f0f0f0;
      position: sticky;
      top: 0;
      z-index: 100;
      transition: background-color 0.25s ease, backdrop-filter 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    /* Active Scroll Effect (Blur + Soft Shadow + Translucent Background) */
    .navbar.scrolled {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-bottom-color: rgba(0, 0, 0, 0.06);
      box-shadow: 0 10px 30px -4px rgba(0, 0, 0, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.03);
    }

    /* Soft progressive blur gradient underneath navbar on scroll */
    .navbar::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 100%;
      height: 24px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 100%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .navbar.scrolled::after {
      opacity: 1;
    }

    /* ============================================================
       Dark Mode Theme Styles
       ============================================================ */
    html.dark body {
      background-color: #0b0f17;
      color: #f3f4f6;
    }

    html.dark .navbar {
      background: #0b0f17;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    html.dark .navbar.scrolled {
      background: rgba(11, 15, 23, 0.82);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-bottom-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 30px -4px rgba(0, 0, 0, 0.6), 0 2px 6px -1px rgba(0, 0, 0, 0.4);
    }

    html.dark .navbar::after {
      background: linear-gradient(to bottom, rgba(11, 15, 23, 0.85) 0%, rgba(11, 15, 23, 0) 100%);
    }

    html.dark .navbar-brand {
      color: #ffffff;
    }

    html.dark .navbar-link {
      color: #9ca3af;
    }

    html.dark .navbar-link:hover {
      color: #ffffff;
    }

    html.dark .badge-soon {
      color: #fb923c;
      background-color: rgba(234, 88, 12, 0.18);
      border: 1px solid rgba(251, 146, 60, 0.25);
    }

    html.dark .action-button {
      color: #9ca3af;
    }

    html.dark .action-button:hover {
      color: #ffffff;
    }

    /* Theme icon toggle switch visibility */
    .icon-sun {
      display: none;
    }
    .icon-moon {
      display: block;
    }

    html.dark .icon-moon {
      display: none;
    }
    html.dark .icon-sun {
      display: block;
    }

    /* Smooth transition for theme switching */
    body, .navbar, .navbar-brand, .navbar-link, .action-button, .badge-soon {
      transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    /* Brand / Logo */
    .navbar-brand {
      display: flex;
      align-items: center;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #111827;
      text-decoration: none;
      user-select: none;
    }

    .navbar-brand .dash {
      display: inline-block;
      margin: 0 6px;
      font-weight: 400;
      opacity: 0.7;
    }

    /* Center / Main Navigation Links */
    .navbar-menu {
      display: flex;
      align-items: center;
      list-style: none;
      gap: 2rem;
    }

    .navbar-item {
      display: flex;
      align-items: center;
    }

    .navbar-link {
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #4b5563;
      transition: color 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .navbar-link:hover {
      color: #000000;
    }

    /* Badge "SOON" */
    .badge-soon {
      display: inline-block;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #ea580c;
      background-color: #ffedd5;
      padding: 2px 7px;
      border-radius: 9999px;
      line-height: 1.2;
    }

    /* Action Icons (Right) */
    .navbar-actions {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .action-button {
      background: none;
      border: none;
      padding: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #374151;
      cursor: pointer;
      border-radius: 6px;
      transition: color 0.18s ease, transform 0.15s ease;
    }

    .action-button:hover {
      color: #000000;
      transform: translateY(-1px);
    }

    .action-button svg {
      width: 19px;
      height: 19px;
      stroke-width: 1.65;
    }

    /* Responsive Handling */
    @media (max-width: 1024px) {
      .navbar {
        padding: 0 1.25rem;
        height: 62px;
      }

      .navbar-menu {
        gap: 1.25rem;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .navbar-menu::-webkit-scrollbar {
        display: none;
      }

      .navbar-link {
        font-size: 11.5px;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <!-- Brand / Logo -->
    <a href="/" class="navbar-brand">
      <span>A</span>
      <span class="dash">—</span>
      <span>Z</span>
    </a>

    <!-- Menu Links -->
    <nav>
      <ul class="navbar-menu">
        <li class="navbar-item">
          <a href="#cases" class="navbar-link">Cases</a>
        </li>
        <li class="navbar-item">
          <a href="#products" class="navbar-link">Products</a>
        </li>
        <li class="navbar-item">
          <a href="#code" class="navbar-link">Code</a>
        </li>
        <li class="navbar-item">
          <a href="#misc" class="navbar-link">Misc</a>
        </li>
        <li class="navbar-item">
          <a href="#notes" class="navbar-link">Notes</a>
        </li>
        <li class="navbar-item">
          <a href="#aiux" class="navbar-link">Aiux</a>
        </li>
        <li class="navbar-item">
          <a href="#resume" class="navbar-link">Resume</a>
        </li>
        <li class="navbar-item">
          <a href="#work-together" class="navbar-link">Work Together</a>
        </li>
        <li class="navbar-item">
          <a href="#shop" class="navbar-link">
            Shop
            <span class="badge-soon">Soon</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Right Side Actions / Icons -->
    <div class="navbar-actions">
      <!-- Dark Mode / Theme Toggle -->
      <button type="button" class="action-button theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
        <!-- Moon Icon (Light Mode) -->
        <svg class="theme-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <!-- Sun Icon (Dark Mode) -->
        <svg class="theme-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>

      <!-- Shopping Bag -->
      <button type="button" class="action-button" aria-label="Shopping bag">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
      </button>

      <!-- Contact / Email -->
      <button type="button" class="action-button" aria-label="Contact / Email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"></rect>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Halaman di bawah kosong, scroll diaktifkan melalui CSS min-height pada body -->

  <!-- Scripts: Scroll Blur & Dark Mode Toggle -->
  <script>
    // 1. Scroll Effect (Blur & Shadow)
    const navbar = document.querySelector('.navbar');

    function handleScroll() {
      if (window.scrollY > 15) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    }

    window.addEventListener('scroll', handleScroll, { passive: true });
    handleScroll();

    // 2. Dark Mode Toggle with LocalStorage & OS Preference
    const themeToggleBtn = document.getElementById('theme-toggle');
    const htmlElement = document.documentElement;

    // Inisialisasi tema dari localStorage atau preferensi sistem
    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
      htmlElement.classList.add('dark');
    } else {
      htmlElement.classList.remove('dark');
    }

    // Event listener klik tombol tema
    themeToggleBtn.addEventListener('click', () => {
      const isDark = htmlElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
  </script>
</body>
</html>
